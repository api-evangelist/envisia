name: Envisia
description: >-
  Envisia (Envisia Therapeutics, Inc.) was a clinical-stage biopharmaceutical company based in
  Research Triangle Park, North Carolina, spun out of Liquidia Technologies to apply PRINT
  (Particle Replication In Non-wetting Templates) particle-engineering to sustained-release
  ophthalmic therapeutics. Its lead candidate, ENV515 (travoprost) extended-release, was an
  intracameral implant intended to lower intraocular pressure in glaucoma patients for months
  from a single administration. The company was venture-backed by Canaan Partners, New Enterprise
  Associates, Morningside, and Batterson Venture Capital, and was acquired by Aerie Pharmaceuticals
  in October 2016. As a therapeutics company it exposes no public developer, API, or documentation
  surface, and its former web domains no longer resolve; this profile is retained as a
  VC-portfolio lead record with no API artifacts to enrich.
